[package]
name = "esp32-blinky"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "esp32-blinky"
harness = false

[profile.release]
opt-level = "s"
lto = true            # link-time optimization across all crates
codegen-units = 1     # one CGU = more cross-fn opt at the cost of build speed
strip = true          # drop ELF symbols not needed at runtime
panic = "abort"       # smaller panic handler; matches build-std=panic_abort

[profile.dev]
debug = true
opt-level = "z"

[features]
default = ["std", "esp-idf-svc/native", "esp-idf-svc/binstart"]
pio = ["esp-idf-svc/pio"]
std = ["esp-idf-svc/std"]

[dependencies]
# `log-always` makes tracing emit log records even when a Subscriber is
# set, so EspLogger (a log::Logger) keeps writing to the serial console
# in addition to whatever subscriber layers we install (cloud_log).
tracing = { version = "0.1", features = ["log-always"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
anyhow = "1"
esp-idf-svc = "0.52"
embedded-svc = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# `hex::encode` to render SHA digests; sha2 0.11's output type
# (`Array<u8, _>`) doesn't implement `LowerHex` like `GenericArray`
# did, so `format!("{:x}", ...)` no longer works.
hex = "0.4"
# Phase 4a: cosign Sigstore Bundle verification.
p256 = { version = "0.13", features = ["ecdsa"] }      # leaf signs DSSE
p384 = { version = "0.13", features = ["ecdsa"] }      # intermediate signs leaf
x509-cert = { version = "0.2", features = ["pem"] }
base64 = "0.22"
# Cloud Logging: RSA-PKCS#1v1.5 SHA-256 signing for service-account JWTs.
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "sha2"] }
# RFC 3339 timestamp formatting for Cloud Logging entries.
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
# E-ink display stack. `epd-waveshare`'s default features pull in
# `linux-embedded-hal`, which doesn't cross-compile to xtensa-esp32-espidf
# — disable defaults and re-enable only what we need. The `epd2in13_v3`
# feature selects the SSD1680-based 2.13" V3/V4 panel (Inland 632694 is a
# Waveshare V3 rebrand).
embedded-graphics = "0.8.2"
epd-waveshare = { version = "0.6.0", default-features = false, features = ["graphics", "epd2in13_v3"] }
embedded-hal = "1.0"
# `ExclusiveDevice` wraps an SPI bus + CS pin + Delay into the
# `SpiDevice` trait that `epd-waveshare` 0.6 consumes.
embedded-hal-bus = "0.2"
# Larger / nicer font set than embedded-graphics' built-ins. The
# `embedded_graphics_textstyle` feature lets fonts plug into e-g's
# `Text` rendering path.
u8g2-fonts = { version = "0.7.2", features = ["embedded_graphics_textstyle"] }

[build-dependencies]
embuild = "0.33"

[package]
name = "esp32-blinky"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "esp32-blinky"
harness = false

[profile.release]
opt-level = "s"
lto = true            # link-time optimization across all crates
codegen-units = 1     # one CGU = more cross-fn opt at the cost of build speed
strip = true          # drop ELF symbols not needed at runtime
panic = "abort"       # smaller panic handler; matches build-std=panic_abort

[profile.dev]
debug = true
opt-level = "z"

[features]
default = ["std", "esp-idf-svc/native", "esp-idf-svc/binstart"]
pio = ["esp-idf-svc/pio"]
std = ["esp-idf-svc/std"]

[dependencies]
# `log` feature makes tracing events emit log records too, so EspLogger
# (which is a log::Logger) picks them up and writes via esp_log_write.
# No tracing subscriber needed on the device; structured fields render
# into the message text.
tracing = { version = "0.1", features = ["log"] }
anyhow = "1"
esp-idf-svc = "0.52"
embedded-svc = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Phase 4a: cosign Sigstore Bundle verification.
p256 = { version = "0.13", features = ["ecdsa"] }      # leaf signs DSSE
p384 = { version = "0.13", features = ["ecdsa"] }      # intermediate signs leaf
x509-cert = { version = "0.2", features = ["pem"] }
base64 = "0.22"

[build-dependencies]
embuild = "0.33"
